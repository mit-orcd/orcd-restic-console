app:
  host: "0.0.0.0"
  port: 8080
  secret_key: "change-me"
  max_jobs: 4
restic:
  binary: "/usr/local/bin/restic"
  password_file: "/root/.backup_pass"
  compression: "auto"
  keep_daily: 14
  keep_weekly: 2
  # Persistent metadata cache on fast flash. Keeps index/tree blobs local so repeat
  # snapshots/ls don't re-read metadata over the Wasabi mount, and keeps the cache off /.
  # Empty = restic default (~/.cache/restic).
  cache_dir: "/stage/restore/console-cache"
  # Cap paths returned by the recovery "ls" listing to protect memory on huge repos.
  # Empty/0 = unlimited (the response also flags "truncated": true when the cap is hit).
  ls_max_paths: 500000
paths:
  log_dir: "./data/logs"
  # Optional: when APP_DEBUG=1, also append detailed app logs here
  # debug_log_file: "./data/debug.log"
  job_store: "./data/job_history.json"
  restore_root: "/mnt/restores"
  # Root dirs for recovery panel (see config/recovery_roots.yml; admin can add more via Maintenance)
  backup_user_home: "/mnt/wasabi_backup_home/home3"
  backup_software: "/mnt/wasabi_backup_software/software"
  default_restore_target: "/stage/restore"
  restore_log: "/db/restic/log/restore.log"
  users_file: "/db/restic/sec/users"
aws:
  binary: "/usr/local/bin/aws"
  default_region: "us-east-1"
  default_endpoint: "s3.amazonaws.com"
